# Memory for gradle. Minecraft decompile needs a few GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# The mod itself targets Java 17 (see java.toolchain in build.gradle), which Gradle provisions on
# its own, so Gradle may run on your system JDK. Verified building on both JDK 17 and JDK 21.
# If your setup needs Gradle pinned to a specific JDK, set org.gradle.java.home in your own
# ~/.gradle/gradle.properties rather than here (that path is machine-specific).

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties
mod_id=fc8weight
mod_name=Weight & Strength
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.fc8.fc8weight
mod_authors=evar0801
mod_description=Encumbrance + strength gating for Epic Fight. A material tier table prices every weapon in strength; too weak and your basic attacks are canceled. Heavy gear slows movement, and the strength a weapon demands is paid back as bonus damage.
